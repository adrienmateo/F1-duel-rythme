<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Du besoin au backlog — Adrien-Matéo Soules</title>
  <meta name="description" content="Étude de cas : cadrage d'un portail de retours e-commerce, backlog de 38 user stories, Sprint 1 priorisé, critères Gherkin et wireframes.">
  <meta property="og:title" content="Du besoin au backlog — Adrien-Matéo Soules">
  <meta property="og:description" content="Étude de cas : cadrage d'un portail de retours e-commerce, backlog de 38 user stories, Sprint 1 priorisé, critères Gherkin et wireframes.">
  <meta property="og:image" content="https://adrienmateo-soules.com/photo.jpg">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231F5E4E'/%3E%3Ctext x='16' y='21.5' font-family='Arial' font-weight='700' font-size='14' fill='white' text-anchor='middle'%3EAS%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="backlog">
  <a class="skip" href="#main" data-i18n="ui.skip">Aller au contenu</a>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="index.html" data-langlink="index.html">Adrien-Matéo Soules</a>
      <a class="back" href="index.html" data-langlink="index.html" data-hash="#work" data-i18n="ui.back">Retour au portfolio</a>
      <div class="lang" role="group" aria-label="Langue / Language">
        <button type="button" data-lang="fr" aria-pressed="true">FR</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
  </header>

  <main id="main">
    <div id="bl-root"></div>

    <section class="wrap project-hero">
      <span class="kind hero-in" data-i18n="backlog.kind"></span>
      <h1 class="hero-in" style="--i:1" data-i18n="backlog.title"></h1>
      <p class="pitch hero-in" style="--i:2" data-i18n="backlog.lead"></p>
      <div class="actions">
        <a class="btn primary notion-link" href="#" target="_blank" rel="noopener" data-i18n="backlog.notionCta"></a>
      </div>
    </section>

    <section class="section wrap">
      <div class="goals">
        <article class="goal">
          <h3 data-i18n="backlog.contextTitle"></h3>
          <p data-i18n="backlog.context"></p>
        </article>
        <article class="goal">
          <h3 data-i18n="backlog.problemTitle"></h3>
          <ul class="plain-list" id="bl-problem"></ul>
        </article>
      </div>
    </section>

    <section class="section wrap">
      <h2 data-i18n="backlog.approachTitle"></h2>
      <ol class="approach" id="bl-approach"></ol>
    </section>

    <section class="section wrap">
      <h2 data-i18n="backlog.sprintTitle"></h2>
      <p class="lead" data-i18n="backlog.sprintLead"></p>
      <div class="table-wrap sprint-wrap"><table class="sprint" id="bl-sprint"></table></div>
      <p class="reserve" data-i18n="backlog.reserve"></p>
    </section>

    <section class="section wrap">
      <h2 data-i18n="backlog.wfTitle"></h2>
      <p class="lead" data-i18n="backlog.wfLead"></p>
      <div id="bl-wf"></div>
    </section>

    <section class="section wrap more">
      <h2 data-i18n="backlog.moreTitle"></h2>
      <p class="lead" data-i18n="backlog.moreText"></p>
      <a class="btn primary notion-link" href="#" target="_blank" rel="noopener" data-i18n="backlog.notionCta"></a>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap" data-i18n="footer"></div>
  </footer>

  <script src="content.js"></script>
  <script src="tools.js"></script>
  <script src="main.js"></script>
</body>
</html>
